<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V0RT3X Chat</title>
  <style>
    /* V0RT3X Chat — Seraph gamehub inspired + smoother UI */
    :root {
      --bg: #000000;
      --surface: #0d0d0d;
      --surface2: #161616;
      --text: #ffffff;
      --muted: #a8a8a8;
      --border: #ffffff;
      --hover: #1c1c1c;
      --glow: #000000;
      --own: #1a1a1a;
      --other: #111111;
      --danger: #ff4d6a;
      --success: #2fce56;
      --voice: #5b8def;
      --radius: 14px;
      --font: "Ubuntu", "Segoe UI", system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 2px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .logo {
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: 0.1em;
      color: var(--text);
      text-shadow:
        0 0 8px rgba(255,255,255,0.35),
        0 0 18px rgba(255,255,255,0.15);
    }
    .logo span {
      opacity: 0.55;
      font-weight: 400;
      font-size: 0.8em;
      letter-spacing: 0.05em;
      text-shadow: none;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.on { background: var(--success); box-shadow: 0 0 10px var(--success); }
    .dot.enc { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.6); }
    .dot.voice { background: var(--voice); box-shadow: 0 0 10px var(--voice); }

    main { flex: 1; display: flex; min-height: 0; }

    .panel {
      width: 300px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .panel h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, button { font-family: var(--font); font-size: 0.88rem; }
    input {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface2);
      border: 2px solid #333;
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }
    input:focus {
      border-color: var(--border);
      background: var(--hover);
    }

    .btn {
      padding: 9px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s var(--ease), transform 0.15s var(--ease), opacity 0.2s;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
      background: transparent;
    }
    .btn-danger:hover:not(:disabled) { background: rgba(255,77,106,0.12); }

    .btn-voice {
      border-color: var(--voice);
      color: var(--voice);
      background: transparent;
    }
    .btn-voice:hover:not(:disabled) { background: rgba(91,141,239,0.12); }
    .btn-voice.active {
      background: rgba(91,141,239,0.2);
      box-shadow: 0 0 12px rgba(91,141,239,0.35);
    }

    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .hint code {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 0.68rem;
      border: 1px solid #333;
    }

    .voice-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: var(--surface2);
      border: 2px solid #333;
      border-radius: var(--radius);
      transition: border-color 0.25s var(--ease);
    }
    .voice-bar.on { border-color: var(--voice); }
    .voice-bar .label {
      width: 100%;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .voice-peers {
      width: 100%;
      font-size: 0.72rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .voice-peers span {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 2px 8px;
      background: rgba(91,141,239,0.15);
      border-radius: 999px;
      color: #b8d0ff;
    }

    .credit {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
      font-size: 0.68rem;
      color: #666;
      text-align: center;
      line-height: 1.4;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 0.9rem;
      word-break: break-word;
      border: 1.5px solid #333;
      animation: msgIn 0.28s var(--ease);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.own {
      align-self: flex-end;
      background: var(--own);
      border-color: #444;
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: var(--other);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      border: none;
      padding: 3px 8px;
      animation: none;
    }
    .msg .meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 2px;
      display: flex;
      gap: 8px;
    }
    .msg.own .meta { justify-content: flex-end; }
    .msg .user {
      color: var(--text);
      font-weight: 600;
      text-shadow: 0 0 6px rgba(255,255,255,0.25);
    }

    .compose {
      padding: 12px 16px;
      border-top: 2px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .compose input { flex: 1; padding: 11px 13px; }
    .compose .btn { padding: 11px 16px; white-space: nowrap; }

    @media (max-width: 720px) {
      main { flex-direction: column; }
      .panel {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid var(--border);
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">V0RT3X <span>Chat</span></div>
    <div class="status">
      <span id="statusText">disconnected</span>
      <div class="dot" id="connDot" title="Connection"></div>
      <div class="dot" id="encDot" title="Encryption"></div>
      <div class="dot" id="voiceDot" title="Voice"></div>
    </div>
  </header>

  <main>
    <aside class="panel">
      <div>
        <h2>Identity</h2>
        <label for="username">Username</label>
        <input id="username" placeholder="anon" maxlength="24" value="user" />
      </div>

      <div>
        <h2>Room = WSS Link</h2>
        <label for="relay">WebSocket URL</label>
        <input id="relay" placeholder="wss://relay.example/r/my-room" value="" />
        <p class="hint" style="margin-top:5px">Each unique link is a room.</p>
      </div>

      <div>
        <h2>Encryption</h2>
        <label for="passphrase">Shared passphrase</label>
        <input id="passphrase" type="password" placeholder="strong secret" autocomplete="off" />
      </div>

      <div class="row">
        <button class="btn" id="connectBtn">Connect</button>
        <button class="btn btn-danger" id="disconnectBtn" disabled>Leave</button>
      </div>

      <div>
        <h2>Voice</h2>
        <div class="voice-bar" id="voiceBar">
          <div class="label">WebRTC P2P · low load on relay</div>
          <button class="btn btn-voice" id="voiceJoinBtn" disabled>Join Voice</button>
          <button class="btn btn-voice" id="voiceMuteBtn" disabled>Mute</button>
          <button class="btn btn-danger" id="voiceLeaveBtn" disabled>Leave VC</button>
          <div class="voice-peers" id="voicePeers"></div>
        </div>
      </div>

      <div class="credit">
        made by Xclounkit234X got bored.<br>
        V0RT3X Chat · seraph-inspired
      </div>
    </aside>

    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="compose">
        <input id="msgInput" placeholder="Message… (Enter to send)" disabled autocomplete="off" />
        <button class="btn" id="sendBtn" disabled>Send</button>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const els = {
      username: $("username"),
      relay: $("relay"),
      passphrase: $("passphrase"),
      connectBtn: $("connectBtn"),
      disconnectBtn: $("disconnectBtn"),
      msgInput: $("msgInput"),
      sendBtn: $("sendBtn"),
      messages: $("messages"),
      statusText: $("statusText"),
      connDot: $("connDot"),
      encDot: $("encDot"),
      voiceDot: $("voiceDot"),
      voiceBar: $("voiceBar"),
      voiceJoinBtn: $("voiceJoinBtn"),
      voiceMuteBtn: $("voiceMuteBtn"),
      voiceLeaveBtn: $("voiceLeaveBtn"),
      voicePeers: $("voicePeers"),
    };

    let ws = null;
    let aesKey = null;
    let connected = false;
    let myId = crypto.randomUUID().slice(0, 8);
    let currentRoomKey = "";
    let myName = "user";

    let inVoice = false;
    let muted = false;
    let localStream = null;
    const peers = new Map();
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
      ],
    };

    async function deriveKey(passphrase, roomKey) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      const salt = enc.encode("V0RT3X-v2|" + roomKey);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encrypt(text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, encoded);
      const packed = new Uint8Array(12 + cipher.byteLength);
      packed.set(iv, 0);
      packed.set(new Uint8Array(cipher), 12);
      return btoa(String.fromCharCode(...packed));
    }

    async function decrypt(b64) {
      try {
        const packed = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const iv = packed.slice(0, 12);
        const data = packed.slice(12);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, data);
        return new TextDecoder().decode(plain);
      } catch { return null; }
    }

    function setStatus(text, conn, enc, voice) {
      els.statusText.textContent = text;
      els.connDot.classList.toggle("on", !!conn);
      els.encDot.classList.toggle("enc", !!enc);
      els.voiceDot.classList.toggle("voice", !!voice);
    }

    function addMessage({ type = "other", user, text, time }) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      if (type === "system") {
        div.textContent = text;
      } else {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `<span class="user">${esc(user || "?")}</span><span>${time || ""}</span>`;
        div.appendChild(meta);
        const body = document.createElement("div");
        body.textContent = text;
        div.appendChild(body);
      }
      els.messages.appendChild(div);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function esc(s) {
      return s.replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function nowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function roomKeyFromUrl(url) {
      try {
        const u = new URL(url);
        return (u.host + u.pathname).replace(/\/+$/, "") || u.host;
      } catch { return url; }
    }

    function updateVoicePeersUI() {
      const names = [];
      for (const [, p] of peers) names.push(p.name || p.id);
      if (inVoice) names.unshift(myName + (muted ? " (muted)" : ""));
      els.voicePeers.innerHTML = names.length
        ? names.map((n) => `<span>${esc(n)}</span>`).join("")
        : "";
    }

    function setVoiceUI() {
      els.voiceBar.classList.toggle("on", inVoice);
      els.voiceJoinBtn.disabled = !connected || inVoice;
      els.voiceMuteBtn.disabled = !inVoice;
      els.voiceLeaveBtn.disabled = !inVoice;
      els.voiceMuteBtn.textContent = muted ? "Unmute" : "Mute";
      els.voiceMuteBtn.classList.toggle("active", muted);
      els.voiceJoinBtn.classList.toggle("active", inVoice);
      updateVoicePeersUI();
      setStatus(
        connected ? (inVoice ? "connected · voice on" : "connected · encrypted") : "disconnected",
        connected,
        !!aesKey,
        inVoice
      );
    }

    function sendRaw(obj) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(obj));
    }

    function connect() {
      const url = els.relay.value.trim();
      const pass = els.passphrase.value;
      myName = (els.username.value.trim() || "anon").slice(0, 24);

      if (!url || (!url.startsWith("wss://") && !url.startsWith("ws://"))) {
        addMessage({ type: "system", text: "Enter a valid ws:// or wss:// URL." });
        return;
      }
      if (!pass || pass.length < 4) {
        addMessage({ type: "system", text: "Passphrase must be at least 4 characters." });
        return;
      }

      currentRoomKey = roomKeyFromUrl(url);
      els.connectBtn.disabled = true;
      setStatus("connecting…", false, false, false);

      deriveKey(pass, currentRoomKey)
        .then((key) => {
          aesKey = key;
          ws = new WebSocket(url);

          ws.onopen = () => {
            connected = true;
            els.disconnectBtn.disabled = false;
            els.msgInput.disabled = false;
            els.sendBtn.disabled = false;
            setVoiceUI();
            addMessage({ type: "system", text: "Joined " + currentRoomKey });
            sendRaw({ t: "join", u: myName, id: myId });
          };

          ws.onmessage = async (ev) => {
            let data;
            try { data = JSON.parse(ev.data); } catch { return; }
            if (!data) return;

            if (data.t === "join" && data.id !== myId) {
              addMessage({ type: "system", text: (data.u || "someone") + " joined" });
              if (inVoice && data.id) ensurePeer(data.id, data.u || "?", true);
              return;
            }

            if (data.t === "msg" && data.c) {
              const plain = await decrypt(data.c);
              if (plain === null) return;
              const isOwn = data.id === myId;
              addMessage({
                type: isOwn ? "own" : "other",
                user: data.u || "?",
                text: plain,
                time: data.ts
                  ? new Date(data.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                  : nowTime(),
              });
              return;
            }

            if (data.t === "signal" && data.id !== myId) {
              handleSignal(data);
              return;
            }

            if (data.t === "voice-leave" && data.id !== myId) {
              removePeer(data.id);
              return;
            }

            if (data.t === "voice-join" && data.id !== myId) {
              if (inVoice) ensurePeer(data.id, data.u || "?", true);
            }
          };

          ws.onclose = () => {
            connected = false;
            leaveVoice(true);
            aesKey = null;
            els.connectBtn.disabled = false;
            els.disconnectBtn.disabled = true;
            els.msgInput.disabled = true;
            els.sendBtn.disabled = true;
            setVoiceUI();
            setStatus("disconnected", false, false, false);
            addMessage({ type: "system", text: "Disconnected" });
          };

          ws.onerror = () => {
            addMessage({ type: "system", text: "WebSocket error — check URL / network" });
          };
        })
        .catch((err) => {
          console.error(err);
          els.connectBtn.disabled = false;
          setStatus("key error", false, false, false);
          addMessage({ type: "system", text: "Failed to derive key" });
        });
    }

    function disconnect() {
      leaveVoice(true);
      if (ws) { ws.close(); ws = null; }
    }

    async function sendMessage() {
      const text = els.msgInput.value.trim();
      if (!text || !aesKey || !connected) return;
      const cipher = await encrypt(text);
      sendRaw({ t: "msg", u: myName, id: myId, ts: Date.now(), c: cipher });
      addMessage({ type: "own", user: myName, text, time: nowTime() });
      els.msgInput.value = "";
      els.msgInput.focus();
    }

    async function joinVoice() {
      if (!connected || inVoice) return;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
          video: false,
        });
      } catch (e) {
        addMessage({ type: "system", text: "Mic permission denied or unavailable" });
        return;
      }

      inVoice = true;
      muted = false;
      setVoiceUI();
      addMessage({ type: "system", text: "Joined voice" });
      sendRaw({ t: "voice-join", u: myName, id: myId });
    }

    function leaveVoice(silent) {
      if (!inVoice && !localStream) return;
      inVoice = false;
      muted = false;

      for (const [id] of peers) removePeer(id);
      peers.clear();

      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }

      if (!silent && connected) {
        sendRaw({ t: "voice-leave", id: myId });
        addMessage({ type: "system", text: "Left voice" });
      }
      setVoiceUI();
    }

    function toggleMute() {
      if (!localStream) return;
      muted = !muted;
      localStream.getAudioTracks().forEach((t) => { t.enabled = !muted; });
      setVoiceUI();
    }

    function ensurePeer(id, name, initiator) {
      if (id === myId || peers.has(id) || !inVoice || !localStream) return;

      const pc = new RTCPeerConnection(rtcConfig);
      const entry = { pc, name: name || id, audio: null };
      peers.set(id, entry);
      updateVoicePeersUI();

      localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

      pc.onicecandidate = (ev) => {
        if (ev.candidate) {
          sendRaw({
            t: "signal",
            id: myId,
            to: id,
            u: myName,
            kind: "ice",
            payload: ev.candidate,
          });
        }
      };

      pc.ontrack = (ev) => {
        const stream = ev.streams[0];
        if (!stream) return;
        let audio = entry.audio;
        if (!audio) {
          audio = document.createElement("audio");
          audio.autoplay = true;
          audio.playsInline = true;
          document.body.appendChild(audio);
          entry.audio = audio;
        }
        audio.srcObject = stream;
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed" || pc.connectionState === "closed") {
          removePeer(id);
        }
      };

      if (initiator) {
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .then(() => {
            sendRaw({
              t: "signal",
              id: myId,
              to: id,
              u: myName,
              kind: "offer",
              payload: pc.localDescription,
            });
          })
          .catch(console.error);
      }
    }

    async function handleSignal(data) {
      if (!inVoice || !localStream) return;
      if (data.to && data.to !== myId) return;

      const from = data.id;
      if (!from || from === myId) return;

      if (!peers.has(from)) {
        ensurePeer(from, data.u || "?", false);
      }
      const entry = peers.get(from);
      if (!entry) return;
      const pc = entry.pc;

      try {
        if (data.kind === "offer") {
          await pc.setRemoteDescription(data.payload);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendRaw({
            t: "signal",
            id: myId,
            to: from,
            u: myName,
            kind: "answer",
            payload: pc.localDescription,
          });
        } else if (data.kind === "answer") {
          await pc.setRemoteDescription(data.payload);
        } else if (data.kind === "ice" && data.payload) {
          await pc.addIceCandidate(data.payload);
        }
      } catch (e) {
        console.warn("signal error", e);
      }
    }

    function removePeer(id) {
      const entry = peers.get(id);
      if (!entry) return;
      try { entry.pc.close(); } catch (_) {}
      if (entry.audio) {
        entry.audio.srcObject = null;
        entry.audio.remove();
      }
      peers.delete(id);
      updateVoicePeersUI();
    }

    els.connectBtn.addEventListener("click", connect);
    els.disconnectBtn.addEventListener("click", disconnect);
    els.sendBtn.addEventListener("click", sendMessage);
    els.msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    els.voiceJoinBtn.addEventListener("click", joinVoice);
    els.voiceLeaveBtn.addEventListener("click", () => leaveVoice(false));
    els.voiceMuteBtn.addEventListener("click", toggleMute);

    (function () {
      const hash = location.hash.slice(1);
      if (!hash) return;
      const parts = hash.split("|");
      if (parts[0] && (parts[0].startsWith("ws://") || parts[0].startsWith("wss://"))) {
        els.relay.value = decodeURIComponent(parts[0]);
      }
      if (parts[1]) els.passphrase.value = decodeURIComponent(parts[1]);
    })();

    addMessage({
      type: "system",
      text: "V0RT3X Chat ready. Connect to a room, then Join Voice for P2P audio.",
    });
    setVoiceUI();
  </script>
</body>
</html>
